<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>flags or food</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:24px;background:#f4f4f2;color:#111}h1{font-size:44px;line-height:.95;margin:.2em 0}.big{font-size:64px;font-weight:900;color:#B22234}table{width:100%;border-collapse:collapse;margin-top:24px;font-variant-numeric:tabular-nums}td,th{padding:8px 4px;border-bottom:1px solid #0001;text-align:left}td:last-child,th:last-child,td:nth-child(3){text-align:right}small{color:#666}</style></head><body>
<h1>flags or food</h1><p>live from <a href="https://anatar.com/us-flags">anatar.com/us-flags</a>. if that money went to WFP meals ($0.80 each) instead</p>
<div id=t>loading…</div><table id=tb></table><p><small id=u></small><br><small>* custom size, priced at the 20'x30' rate per sq ft. a "person fed for a year" = 3 meals a day, 365 days.</small></p>
<script>fetch('/api').then(r=>r.json()).then(d=>{const f=n=>n.toLocaleString('en-US');
t.innerHTML='<div class=big>'+f(d.people_year)+'</div> person-years of food (3 WFP meals a day)<br><small>$'+f(Math.round(d.total_usd))+' on '+d.rows.length+' flags ('+f(d.total_sqft)+' sq ft) = '+f(d.meals)+' meals</small>';
if(d.error){t.textContent='anatar data unavailable right now';return}u.textContent='updated '+new Date(d.updated).toLocaleString();tb.innerHTML='<tr><th>city</th><th>sq ft</th><th>spent</th><th>person-months</th></tr>'+d.rows.map(r=>'<tr><td>'+r.city+'</td><td>'+r.sqft+'</td><td>$'+f(Math.round(r.usd))+(r.est?'*':'')+'</td><td>'+r.person_months+'</td></tr>').join('')})</script></body></html>
